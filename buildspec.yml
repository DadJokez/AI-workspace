version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: ai-workspace
    AGENTCORE_IMAGE_REPO_NAME: ai-workspace-agentcore-agent
    AGENTCORE_RUNTIME_ID: ai_workspace_agent_spike-5n8RLRBVz5
    APP_SECRET_NAME: ai-workspace/production/app
    ECS_CLUSTER_NAME: ai-workspace-prod
    ECS_WEB_SERVICE_NAME: ai-workspace-web
    ECS_CHAT_WORKER_SERVICE_NAME: ai-workspace-chat-worker
    ECS_MEMORY_WORKER_SERVICE_NAME: ai-workspace-memory-worker
    SMOKE_BASE_URL: https://comparative.builtwithrobot.link

phases:
  pre_build:
    commands:
      - 'echo Resolving AWS account ID...'
      - 'AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)'
      - 'echo Account=$AWS_ACCOUNT_ID Region=$AWS_DEFAULT_REGION'
      - 'echo Logging in to Amazon ECR...'
      - 'aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com'
      - 'REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME'
      - 'AGENTCORE_REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$AGENTCORE_IMAGE_REPO_NAME'
      - 'COMMIT_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}'
      # The AgentCore Runtime container must be linux/arm64; this CodeBuild
      # host is x86_64, so register QEMU and build via buildx emulation.
      - 'docker run --privileged --rm tonistiigi/binfmt --install arm64'
      - 'docker buildx create --name agentcore-arm64 --use'
  build:
    commands:
      - 'echo Build started on $(date)'
      - 'docker build -f apps/web/Dockerfile -t $IMAGE_REPO_NAME .'
      - 'docker build -f apps/web/Dockerfile --target migrator -t $IMAGE_REPO_NAME:migrator .'
      - 'docker build -f apps/web/Dockerfile --target worker -t $IMAGE_REPO_NAME:worker .'
      - 'docker build -f apps/web/Dockerfile --target memory-worker -t $IMAGE_REPO_NAME:memory-worker .'
      - 'docker tag $IMAGE_REPO_NAME:latest $REPOSITORY_URI:latest'
      - 'docker tag $IMAGE_REPO_NAME:latest $REPOSITORY_URI:$COMMIT_TAG'
      - 'docker tag $IMAGE_REPO_NAME:worker $REPOSITORY_URI:worker-latest'
      - 'docker tag $IMAGE_REPO_NAME:worker $REPOSITORY_URI:worker-$COMMIT_TAG'
      - 'docker tag $IMAGE_REPO_NAME:memory-worker $REPOSITORY_URI:memory-worker-latest'
      - 'docker tag $IMAGE_REPO_NAME:memory-worker $REPOSITORY_URI:memory-worker-$COMMIT_TAG'
      - 'docker buildx build --platform linux/arm64 -f apps/agentcore-agent/Dockerfile -t $AGENTCORE_REPOSITORY_URI:latest -t $AGENTCORE_REPOSITORY_URI:$COMMIT_TAG --load .'
  post_build:
    commands:
      - 'echo Running database migrations...'
      - 'APP_SECRET_JSON=$(aws secretsmanager get-secret-value --region $AWS_DEFAULT_REGION --secret-id "$APP_SECRET_NAME" --query SecretString --output text)'
      - 'DATABASE_URL=$(printf "%s" "$APP_SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"DATABASE_URL\"])")'
      - 'test -n "$DATABASE_URL" && test "$DATABASE_URL" != "None"'
      - 'docker run --rm -e DATABASE_URL="$DATABASE_URL" $IMAGE_REPO_NAME:migrator'
      - 'echo Pushing the Docker images...'
      - 'docker push $REPOSITORY_URI:latest'
      - 'docker push $REPOSITORY_URI:$COMMIT_TAG'
      - 'docker push $REPOSITORY_URI:worker-latest'
      - 'docker push $REPOSITORY_URI:worker-$COMMIT_TAG'
      - 'docker push $REPOSITORY_URI:memory-worker-latest'
      - 'docker push $REPOSITORY_URI:memory-worker-$COMMIT_TAG'
      - 'docker push $AGENTCORE_REPOSITORY_URI:latest'
      - 'docker push $AGENTCORE_REPOSITORY_URI:$COMMIT_TAG'
      # AgentCore pins the image digest per runtime version (pushing :latest
      # alone deploys nothing), so cut a new version pinned to this commit's
      # tag, carrying over the runtime's current config unchanged.
      - 'echo Cutting a new AgentCore runtime version...'
      - 'AGENTCORE_CONFIG=$(aws bedrock-agentcore-control get-agent-runtime --agent-runtime-id "$AGENTCORE_RUNTIME_ID" --output json)'
      - 'aws bedrock-agentcore-control update-agent-runtime --agent-runtime-id "$AGENTCORE_RUNTIME_ID" --agent-runtime-artifact "{\"containerConfiguration\":{\"containerUri\":\"$AGENTCORE_REPOSITORY_URI:$COMMIT_TAG\"}}" --role-arn "$(echo "$AGENTCORE_CONFIG" | jq -r .roleArn)" --network-configuration "$(echo "$AGENTCORE_CONFIG" | jq -c .networkConfiguration)" --protocol-configuration "$(echo "$AGENTCORE_CONFIG" | jq -c .protocolConfiguration)" --environment-variables "$(echo "$AGENTCORE_CONFIG" | jq -c .environmentVariables)" --lifecycle-configuration "$(echo "$AGENTCORE_CONFIG" | jq -c .lifecycleConfiguration)" --description "$(echo "$AGENTCORE_CONFIG" | jq -r .description)" >/dev/null'
      - 'echo Forcing ECS service deployments...'
      - 'aws ecs update-service --region $AWS_DEFAULT_REGION --cluster "$ECS_CLUSTER_NAME" --service "$ECS_WEB_SERVICE_NAME" --force-new-deployment >/dev/null'
      - 'aws ecs update-service --region $AWS_DEFAULT_REGION --cluster "$ECS_CLUSTER_NAME" --service "$ECS_CHAT_WORKER_SERVICE_NAME" --force-new-deployment >/dev/null'
      - 'aws ecs update-service --region $AWS_DEFAULT_REGION --cluster "$ECS_CLUSTER_NAME" --service "$ECS_MEMORY_WORKER_SERVICE_NAME" --force-new-deployment >/dev/null'
      - 'echo Waiting for ECS services to stabilize...'
      - 'aws ecs wait services-stable --region $AWS_DEFAULT_REGION --cluster "$ECS_CLUSTER_NAME" --services "$ECS_WEB_SERVICE_NAME" "$ECS_CHAT_WORKER_SERVICE_NAME" "$ECS_MEMORY_WORKER_SERVICE_NAME"'
      - 'echo Running authenticated production smoke...'
      - 'NEXTAUTH_SECRET=$(printf "%s" "$APP_SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"NEXTAUTH_SECRET\"])")'
      - 'test -n "$NEXTAUTH_SECRET" && test "$NEXTAUTH_SECRET" != "None"'
      - 'docker run --rm -e DATABASE_URL="$DATABASE_URL" -e NEXTAUTH_SECRET="$NEXTAUTH_SECRET" -e SMOKE_BASE_URL="$SMOKE_BASE_URL" -e SMOKE_RUN_ID="$COMMIT_TAG" $IMAGE_REPO_NAME:worker pnpm --filter @ai-workspace/web smoke:prod:auth'
      - 'echo Build completed on $(date)'
