services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-workspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aihub
      POSTGRES_PASSWORD: aihub_dev
      POSTGRES_DB: aihub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihub -d aihub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
