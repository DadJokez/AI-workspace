name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job here only reads the checked-out source. Without an
# explicit block this workflow inherits the repository default, which can be
# read/write for the whole GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #812: the docs-only fast lane's decision, computed from git alone in the
  # reusable workflow. Every heavy job below needs it and runs unless it
  # reports docs_only == 'true'. `!cancelled()` keeps them running when the
  # classifier job itself errors: a classifier failure is the full lane,
  # never a skip. The required-check names live on the summary jobs at the
  # bottom of this file; the heavy jobs carry a "[full lane]" suffix.
  classify:
    uses: ./.github/workflows/classify-changed-paths.yml

  ci:
    name: lint + typecheck + build [full lane]
    needs: [classify]
    if: ${{ !cancelled() && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # 15, not 10: the job's own work is ~5 min, but #869's coverage lane took
    # the healthy total to ~9 min, and on the slow-registry night of
    # 2026-09-04 `Setup pnpm` alone stalled for 3-7 min (main run 33842828436,
    # PR #877 attempts 1-2), so the 10-minute cap fired after every real step
    # had passed. Same rule as the CVE audit's cap (#864): the cap covers the
    # observed worst-case envelope so the steps, not the runner, decide.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Standard Next.js CI cache: a warm .next/cache cuts `next build` from
      # ~90s to ~20s locally. Source-hash miss falls back to the lockfile
      # restore-key, which still restores a mostly-warm compiler cache.
      - name: Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'packages/**/*.ts', '!**/node_modules/**', '!apps/web/.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # #695: the same unit lane as `pnpm test`, instrumented with v8 coverage.
      # Report-only — no thresholds, so a coverage drop never turns this
      # required check red. The per-package table lands on the run summary
      # page; the raw json-summary/lcov files go up as an artifact below.
      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: |
            apps/*/coverage/coverage-summary.json
            apps/*/coverage/lcov.info
            packages/*/coverage/coverage-summary.json
            packages/*/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      # Free, deterministic eval lane: exercise every suite/case definition
      # and replay every scrubbed alpha failure transcript on every required
      # CI run. Real model behavior is handled by the bounded PR/nightly jobs.
      - name: Structural full eval smoke
        run: pnpm eval --mock

      # #744: free runtime-contract lane. It reconciles every declared
      # capability against deterministic probe evidence and emits JSON plus a
      # Markdown/admin matrix. Offline evidence can block drift in the harness,
      # but the report explicitly cannot qualify a production runtime.
      - name: Offline runtime conformance
        run: pnpm conformance:offline

      - name: Upload runtime conformance report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-conformance-report
          path: packages/evals/conformance-reports/
          if-no-files-found: error

      - name: Golden transcript replay
        run: pnpm transcripts:replay

      - name: Build
        run: pnpm build

  # #459: fail the pipeline when a high/critical advisory lands in the
  # production dependency graph (xlsx's CVEs reached prod because nothing
  # looked). Moderate/low findings report but do not block.
  dependency-audit:
    name: dependency CVE audit [full lane]
    needs: [classify]
    if: ${{ !cancelled() && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # 12, not 5: scripts/audit-prod-deps.sh retries the npm advisory endpoint
    # with backoff, and on a slow registry night (2026-09-03) the 5-minute cap
    # expired mid-retry. GitHub reports a job-timeout as "cancelled", which
    # reads as a failed required check (#862). The cap must cover the
    # script's worst-case retry envelope so the script - not the runner -
    # decides between "finding" and "registry unreachable".
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      # The gate answers "does the production tree contain a known high/critical
      # CVE?". It can only answer that when it can REACH the advisory database.
      # On 2026-07-26 the npm audit endpoint began returning gzip that pnpm
      # 9.12.3 does not decompress ("Unexpected token ... is not valid JSON"),
      # failing this check identically on main and on every PR — an outage
      # indistinguishable, in the old one-line form, from a real vulnerability.
      #
      # A finding is detected POSITIVELY (pnpm prints an advisory table), never
      # by elimination: any other non-zero exit means the audit could not run,
      # which is retried and then warned about. Reporting an unrecognized
      # network error as "CVE found" would fabricate a finding — the same
      # outage-vs-signal confusion inverted (review).
      #
      # DEPENDS ON DEPENDABOT: not blocking on an unreachable registry is only
      # safe because Dependabot alerts + security updates (enabled 2026-07-25)
      # cover this tree over a different path. If Dependabot is ever disabled,
      # this warning path becomes an unguarded hole — restore fail-closed here.
      # Runs first: the classifier is what decides whether a real advisory
      # blocks, so it must itself be gated. Without this the coverage exists
      # but nothing enforces it (review).
      - name: Verify the audit classifier
        run: bash scripts/audit-prod-deps.test.sh

      - name: Audit production dependencies
        run: bash scripts/audit-prod-deps.sh

  scoping-integration:
    name: scoping integration (real Postgres) [full lane]
    needs: [classify]
    if: ${{ !cancelled() && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/local-postgres
        with:
          user: postgres
          password: ci
          database: scoping

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/scoping
        run: pnpm --filter @ai-workspace/db db:migrate

      # #444: cross-user scoping proven through real route handlers and real
      # WHERE clauses — the unit-lane db mocks structurally cannot do this.
      - name: Scoping integration tests
        env:
          INTEGRATION_DATABASE_URL: postgres://postgres:ci@localhost:5432/scoping
        run: pnpm --filter @ai-workspace/web test:integration

  # Non-blocking (not in the required-check set; promoting it is Rob's call —
  # branch protection is human-owned). Today infra errors surface for the
  # first time during the production deploy; this synths both stacks on every
  # PR instead. No continue-on-error: when it breaks, it should fail loudly.
  infra-synth:
    name: infra synth
    needs: [classify]
    if: ${{ !cancelled() && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # CDK_DEFAULT_ACCOUNT must match the account baked into the committed
      # cdk.context.json lookup-cache keys (Vpc/HostedZone.fromLookup); a
      # dummy account misses the cache and forces a live AWS call, which CI
      # has no credentials for. The account id is already committed in
      # cdk.json and cdk.context.json — it is not a secret. --no-lookups
      # turns any future uncached lookup into a crisp "missing context"
      # failure instead of a credentials error.
      - name: CDK synth (offline, cached context)
        env:
          CDK_DEFAULT_ACCOUNT: "351478076796"
          CDK_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: pnpm --filter @ai-workspace/infra exec cdk synth --quiet --no-lookups

  # ---------------------------------------------------------------------------
  # Required-check summaries (#812). Branch protection requires the contexts
  # named below, unchanged. Each name now belongs to exactly ONE job — its
  # summary — so no second check run with a required name can ever exist to
  # collide with it; the heavy jobs above carry a "[full lane]" suffix. A
  # summary passes on a real success of its heavy job, or on a skip the
  # classifier explicitly asked for. A skip without that verdict, a failure,
  # or a cancellation is red: the summaries run on failure (never skip) and
  # exit non-zero, because a skipped required check satisfies branch
  # protection and would fail the gate open.
  # ---------------------------------------------------------------------------
  ci-summary:
    name: lint + typecheck + build
    needs: [classify, ci]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report lint + typecheck + build
        env:
          LABEL: lint + typecheck + build
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          RESULT: ${{ needs.ci.result }}
        run: |
          if [ "$RESULT" = "success" ]; then echo "$LABEL passed"; exit 0; fi
          if [ "$RESULT" = "skipped" ] && [ "$DOCS_ONLY" = "true" ]; then echo "docs-only: skipped"; exit 0; fi
          echo "$LABEL did not pass (result=$RESULT, docs_only=$DOCS_ONLY)"; exit 1

  dependency-audit-summary:
    name: dependency CVE audit
    needs: [classify, dependency-audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report dependency CVE audit
        env:
          LABEL: dependency CVE audit
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          RESULT: ${{ needs.dependency-audit.result }}
        run: |
          if [ "$RESULT" = "success" ]; then echo "$LABEL passed"; exit 0; fi
          if [ "$RESULT" = "skipped" ] && [ "$DOCS_ONLY" = "true" ]; then echo "docs-only: skipped"; exit 0; fi
          echo "$LABEL did not pass (result=$RESULT, docs_only=$DOCS_ONLY)"; exit 1

  scoping-integration-summary:
    name: scoping integration (real Postgres)
    needs: [classify, scoping-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report scoping integration (real Postgres)
        env:
          LABEL: scoping integration (real Postgres)
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          RESULT: ${{ needs.scoping-integration.result }}
        run: |
          if [ "$RESULT" = "success" ]; then echo "$LABEL passed"; exit 0; fi
          if [ "$RESULT" = "skipped" ] && [ "$DOCS_ONLY" = "true" ]; then echo "docs-only: skipped"; exit 0; fi
          echo "$LABEL did not pass (result=$RESULT, docs_only=$DOCS_ONLY)"; exit 1
