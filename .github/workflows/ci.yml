name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Standard Next.js CI cache: a warm .next/cache cuts `next build` from
      # ~90s to ~20s locally. Source-hash miss falls back to the lockfile
      # restore-key, which still restores a mostly-warm compiler cache.
      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'packages/**/*.ts', '!**/node_modules/**', '!apps/web/.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Free, deterministic eval lane: exercise every suite/case definition
      # and replay every scrubbed alpha failure transcript on every required
      # CI run. Real model behavior is handled by the bounded PR/nightly jobs.
      - name: Structural full eval smoke
        run: pnpm eval --mock

      - name: Golden transcript replay
        run: pnpm transcripts:replay

      - name: Build
        run: pnpm build

  # #459: fail the pipeline when a high/critical advisory lands in the
  # production dependency graph (xlsx's CVEs reached prod because nothing
  # looked). Moderate/low findings report but do not block.
  dependency-audit:
    name: dependency CVE audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  scoping-integration:
    name: scoping integration (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: scoping
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/scoping
        run: pnpm --filter @ai-workspace/db db:migrate

      # #444: cross-user scoping proven through real route handlers and real
      # WHERE clauses — the unit-lane db mocks structurally cannot do this.
      - name: Scoping integration tests
        env:
          INTEGRATION_DATABASE_URL: postgres://postgres:ci@localhost:5432/scoping
        run: pnpm --filter @ai-workspace/web test:integration

  # Non-blocking (not in the required-check set; promoting it is Rob's call —
  # branch protection is human-owned). Today infra errors surface for the
  # first time during the production deploy; this synths both stacks on every
  # PR instead. No continue-on-error: when it breaks, it should fail loudly.
  infra-synth:
    name: infra synth
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # CDK_DEFAULT_ACCOUNT must match the account baked into the committed
      # cdk.context.json lookup-cache keys (Vpc/HostedZone.fromLookup); a
      # dummy account misses the cache and forces a live AWS call, which CI
      # has no credentials for. The account id is already committed in
      # cdk.json and cdk.context.json — it is not a secret. --no-lookups
      # turns any future uncached lookup into a crisp "missing context"
      # failure instead of a credentials error.
      - name: CDK synth (offline, cached context)
        env:
          CDK_DEFAULT_ACCOUNT: "351478076796"
          CDK_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: pnpm --filter @ai-workspace/infra exec cdk synth --quiet --no-lookups
