name: Promote

# Promotion (docs/roadmap/KOCH_MIGRATION_SPEC.md, WP-15): a manual run that
# proposes deploying the release running in one environment to another, by
# the same digests. It never deploys: it opens a pull request that replaces
# envs/<to>/release.auto.tfvars, and merging that pull request deploys it
# through terraform-apply.yml in the GitHub environment <to>, whose
# protection rules (Rob's) decide who may approve it.
#
#   1. The release of envs/<from>/release.auto.tfvars on main must be the one
#      the latest deployment of <from> recorded for its release id, and that
#      deployment must have succeeded.
#   2. When envs/<to>/env.tfvars sets `production = true`, the release must
#      also pass Product Smoke with run_evals=true (`pnpm eval --gate` and the
#      public smoke against <from>'s base URL) on the release commit itself:
#      a temporary branch promote-eval/<release id> points at it, the run is
#      dispatched there and waited for, and the branch is deleted again.
#   3. The pull request comes from the branch release/<to>, so
#      release-checks.yml verifies it like any release: one file, every digest
#      signed for a commit on main.
#
# Until the cutover (WP-20) terraform-apply.yml deploys personal-stage only,
# so a promotion to another environment opens its pull request but its merge
# deploys nothing yet.
#
# The evals in step 2 assume AWS_EVAL_ROLE_ARN as Product Smoke does. That
# role trusts the Product Smoke workflow on pull requests only, so a
# dispatched run cannot assume it and step 2 fails closed until Rob extends
# its trust (infra/terraform/README.md, "Promotion").
#
# The pull request is opened with the release bot's installation token
# (RELEASE_BOT_CLIENT_ID and the secret RELEASE_BOT_PRIVATE_KEY, as in
# build-release.yml); without it the file is uploaded as an artifact and a
# human opens the pull request.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Environment whose deployed release is promoted"
        required: true
        default: personal-stage
        type: string
      to:
        description: "Environment that receives it"
        required: true
        default: personal-prod
        type: string

# No workflow-wide grant: each job takes only what it needs.
permissions: {}

concurrency:
  group: promote-${{ inputs.to }}
  cancel-in-progress: false

jobs:
  check:
    name: check the release
    # A manual run can be started from any branch; only main's files count.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      promote: ${{ steps.deployed.outputs.promote }}
      release_id: ${{ steps.file.outputs.release_id }}
      production: ${{ steps.file.outputs.production }}
      base_url: ${{ steps.deployed.outputs.base_url }}
      deployment_url: ${{ steps.deployed.outputs.deployment_url }}
    env:
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify the release file writer
        run: bash .github/scripts/release-tfvars.test.sh

      # The inputs are text a person typed: checked, then only ever passed
      # through environment variables.
      - name: Write the release file of the target
        id: file
        run: |
          set -euo pipefail
          for name in FROM TO; do
            [[ "${!name}" =~ ^[a-z0-9-]+$ ]] || { echo "::error::$name is not an environment name"; exit 1; }
            [ -d "infra/terraform/envs/${!name}" ] || { echo "::error::there is no infra/terraform/envs/${!name}"; exit 1; }
          done
          mkdir release
          bash .github/scripts/release-tfvars.sh promote HEAD "$FROM" "$TO" > release/release.auto.tfvars
          cat release/release.auto.tfvars
          release_id=$(sed -n 's/^release_id = "\([0-9a-f]\{40\}\)"$/\1/p' release/release.auto.tfvars)
          production=false
          ! grep -Eq '^production[[:space:]]*=[[:space:]]*true[[:space:]]*$' "infra/terraform/envs/$TO/env.tfvars" || production=true
          {
            echo "release_id=$release_id"
            echo "production=$production"
          } >> "$GITHUB_OUTPUT"
          echo "promoting release $release_id from $FROM to $TO (production: $production)"

      # The record terraform-apply.yml leaves for each deploy (task
      # terraform-apply). The newest one for this release id must have
      # succeeded and must name exactly these images.
      - name: Check the deployment of the source
        id: deployed
        env:
          RELEASE_ID: ${{ steps.file.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/deployments?environment=$FROM&task=terraform-apply&per_page=100" > "$RUNNER_TEMP/deployments.json"
          deployment=$(jq -c --arg id "$RELEASE_ID" '[.[] | select(.payload.release_id == $id)] | sort_by(.created_at) | last // empty' \
            "$RUNNER_TEMP/deployments.json")
          [ -n "$deployment" ] || { echo "::error::$FROM has no recorded deployment of release $RELEASE_ID"; exit 1; }
          id=$(jq -r .id <<<"$deployment")
          status=$(gh api "repos/$GH_REPO/deployments/$id/statuses?per_page=1" --jq '.[0] // {}')
          state=$(jq -r '.state // "none"' <<<"$status")
          [ "$state" = success ] || {
            echo "::error::the latest deployment of release $RELEASE_ID to $FROM is '$state', not success"
            exit 1
          }

          # The images that deployment recorded, against the file being promoted.
          sed -n 's/^\(image_[a-z_]*\)[[:space:]]*=[[:space:]]*"\([^"]*\)"$/\1\t\2/p' release/release.auto.tfvars \
            | jq -Rn '[inputs | split("\t") | {(.[0]): .[1]}] | add' > "$RUNNER_TEMP/images.json"
          jq -e --slurpfile want "$RUNNER_TEMP/images.json" '.payload.images == $want[0]' <<<"$deployment" > /dev/null || {
            echo "::error::the images in envs/$FROM/release.auto.tfvars are not the ones deployment $id recorded"
            exit 1
          }
          echo "deployment $id of release $RELEASE_ID to $FROM succeeded"

          current=$(sed -n 's/^release_id = "\([0-9a-f]\{40\}\)"$/\1/p' "infra/terraform/envs/$TO/release.auto.tfvars")
          promote=true
          if [ "$current" = "$RELEASE_ID" ]; then
            promote=false
            echo "::notice::$TO already releases $RELEASE_ID; nothing to promote"
          fi
          {
            echo "promote=$promote"
            echo "base_url=$(jq -r '.environment_url // ""' <<<"$status")"
            echo "deployment_url=$(jq -r '.log_url // ""' <<<"$status")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the release file
        if: steps.deployed.outputs.promote == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promote-${{ inputs.to }}
          path: release/
          if-no-files-found: error
          overwrite: true

  evals:
    name: smoke and evals on the release
    needs: check
    if: needs.check.outputs.promote == 'true' && needs.check.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # The temporary branch at the release commit.
      contents: write
      # Dispatch Product Smoke and read its run.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_ID: ${{ needs.check.outputs.release_id }}
      BASE_URL: ${{ needs.check.outputs.base_url }}
    steps:
      - name: Point a branch at the release commit
        run: |
          set -euo pipefail
          [[ "$BASE_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?(/.*)?$ ]] || {
            echo "::error::the source deployment recorded no https base URL to smoke"
            exit 1
          }
          branch="promote-eval/$RELEASE_ID"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" > /dev/null 2>&1; then
            jq -n --arg sha "$RELEASE_ID" '{sha: $sha, force: true}' \
              | gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" --input - > /dev/null
          else
            jq -n --arg ref "refs/heads/$branch" --arg sha "$RELEASE_ID" '{ref: $ref, sha: $sha}' \
              | gh api "repos/$GH_REPO/git/refs" --input - > /dev/null
          fi

      - name: Run Product Smoke with the evals and wait for it
        run: |
          set -euo pipefail
          # A minute of margin for clock skew; the branch and sha already select the run.
          started=$(date -u -d "-1 minute" +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run product-smoke.yml --ref "$BRANCH" -f base_url="$BASE_URL" -f run_evals=true

          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            run_id=$(gh api "repos/$GH_REPO/actions/workflows/product-smoke.yml/runs?event=workflow_dispatch&branch=$BRANCH&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_sha == \"$RELEASE_ID\" and .created_at >= \"$started\")] | sort_by(.created_at) | last | .id // empty")
            [ -z "$run_id" ] || break
          done
          [ -n "$run_id" ] || { echo "::error::the dispatched Product Smoke run did not appear"; exit 1; }
          echo "Product Smoke run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run_id"

          for _ in $(seq 1 480); do
            [ "$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq .status)" = completed ] && break
            sleep 10
          done
          conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion // ""')
          gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          jq -r '.jobs[] | "\(.conclusion // .status)\t\(.name)"' "$RUNNER_TEMP/jobs.json"
          # Both jobs must have run and passed: a skipped eval job is no gate.
          for job in "foundational real-model evals" "production public smoke"; do
            [ "$(jq -r --arg n "$job" '[.jobs[] | select(.name == $n) | .conclusion] | first // ""' "$RUNNER_TEMP/jobs.json")" = success ] || {
              echo "::error::Product Smoke job '$job' did not succeed on release $RELEASE_ID"
              exit 1
            }
          done
          [ "$conclusion" = success ] || { echo "::error::Product Smoke concluded '$conclusion' on release $RELEASE_ID"; exit 1; }
          echo "EVAL_RUN_URL=$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run_id" >> "$GITHUB_ENV"
          echo "Product Smoke with evals passed on release $RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the branch
        if: always() && env.BRANCH != ''
        run: gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH" || true

  pull-request:
    name: promotion pull request
    needs: [check, evals]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.promote == 'true' &&
          (needs.evals.result == 'success' ||
           (needs.evals.result == 'skipped' && needs.check.outputs.production != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      RELEASE_ID: ${{ needs.check.outputs.release_id }}
      DEPLOYMENT_URL: ${{ needs.check.outputs.deployment_url }}
      PRODUCTION: ${{ needs.check.outputs.production }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download the release file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: promote-${{ inputs.to }}
          path: release

      - name: Write the pull request body
        run: |
          set -euo pipefail
          {
            echo "Promotes release \`$RELEASE_ID\` from \`$FROM\` to \`$TO\` ([promotion run]($RUN_URL))."
            echo
            echo "The only change is \`infra/terraform/envs/$TO/release.auto.tfvars\`: the same release id and the same five digests that \`$FROM\` runs. Its last deployment of this release succeeded ([run]($DEPLOYMENT_URL))."
            if [ "$PRODUCTION" = true ]; then
              echo
              echo "\`$TO\` is a production environment: Product Smoke with the gate evals passed on the release commit (see the promotion run)."
            fi
            echo
            echo "Merging deploys it through \`terraform-apply.yml\` in the GitHub environment \`$TO\`."
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"

      - name: Create the release bot token
        id: bot
        if: vars.RELEASE_BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Like build-release.yml: one commit on top of main through the API, and
      # one update of the branch.
      - name: Open or update the promotion pull request
        if: vars.RELEASE_BOT_CLIENT_ID != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          file="infra/terraform/envs/$TO/release.auto.tfvars"
          branch="release/$TO"
          title="promote($TO): ${RELEASE_ID:0:7} from $FROM"
          head=$(git rev-parse HEAD)
          tree=$(jq -n --arg base "$(git rev-parse "HEAD^{tree}")" --arg path "$file" \
            --rawfile content release/release.auto.tfvars \
            '{base_tree: $base, tree: [{path: $path, mode: "100644", type: "blob", content: $content}]}' \
            | gh api "repos/$GH_REPO/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg message "$title" --arg tree "$tree" --arg parent "$head" \
            '{message: $message, tree: $tree, parents: [$parent]}' \
            | gh api "repos/$GH_REPO/git/commits" --input - --jq .sha)
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" > /dev/null 2>&1; then
            jq -n --arg sha "$commit" '{sha: $sha, force: true}' \
              | gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" --input - > /dev/null
          else
            jq -n --arg ref "refs/heads/$branch" --arg sha "$commit" '{ref: $ref, sha: $sha}' \
              | gh api "repos/$GH_REPO/git/refs" --input - > /dev/null
          fi
          number=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$branch" --base "$BASE_BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Explain how to open the pull request by hand
        if: vars.RELEASE_BOT_CLIENT_ID == ''
        run: |
          {
            echo "No release bot is configured (\`RELEASE_BOT_CLIENT_ID\` is unset), so no pull request was opened."
            echo "Download the artifact \`promote-$TO\`, replace \`infra/terraform/envs/$TO/release.auto.tfvars\` with it"
            echo "on the branch \`release/$TO\`, and open the pull request yourself."
          } >> "$GITHUB_STEP_SUMMARY"
