name: Dependency Audit

# #853: the PR-time `dependency CVE audit` gate in ci.yml only looks at the
# tree when a pull request runs, so an advisory that lands against an
# unchanged lockfile can sit unnoticed for as long as the repo is idle (#845
# went 17 days). This lane runs the same fail-closed script against the
# default branch daily and files/refreshes one tracking issue on a finding,
# mirroring the `notify` pattern in nightly-evals.yml. Fixing advisories stays
# Rob-owned; this only makes them visible.
on:
  schedule:
    - cron: "23 6 * * *" # 06:23 UTC daily
  workflow_dispatch: {} # and on demand

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: scheduled production CVE audit
    runs-on: ubuntu-latest
    # 15, not 10: scripts/audit-prod-deps.sh's bounded retry envelope is up to
    # ~8 min (3 x AUDIT_ATTEMPT_TIMEOUT + backoff, #876) and pnpm setup takes
    # 1-2 min on a slow runner; the first dispatch (run 33850962869) was
    # cancelled at 10m16s inside the audit step.
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      # Same script as the PR gate: exit 1 only on a positively classified
      # high/critical advisory; a registry outage warns and exits 0. The JSON
      # report the script echoes on a finding is captured so the issue body
      # can carry the advisory table.
      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/audit-prod-deps.sh | tee audit-output.log

      - name: Open or refresh tracking issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        with:
          script: |
            const fs = require("node:fs");
            const title = "CVE audit failing on main";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = process.env.AUDIT_OUTCOME !== "success";

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find(
              issue => !issue.pull_request && issue.title === title,
            );

            if (!failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Scheduled audit is green again on ${context.sha.slice(0,7)}: no high/critical advisories in the production tree. Close when confirmed.\n${runUrl}`,
                });
              }
              return;
            }

            // The script prints the pnpm audit JSON report ahead of its
            // ::error line; extract the advisory summary from it. If the
            // shape is unexpected, fall back to the raw log rather than
            // filing an issue with no evidence.
            const log = fs.existsSync("audit-output.log") ? fs.readFileSync("audit-output.log", "utf8") : "";
            let table = "";
            try {
              const start = log.indexOf("{");
              const end = log.lastIndexOf("}");
              const report = JSON.parse(log.slice(start, end + 1));
              const rows = Object.values(report.advisories ?? {}).map(a => {
                const paths = (a.findings ?? []).flatMap(f => f.paths ?? []);
                const id = a.github_advisory_id ?? a.id ?? "";
                return `| ${a.module_name} | ${a.severity} | ${a.url ? `[${id}](${a.url})` : id} | ${paths.map(p => `\`${p}\``).join("<br>") || "-"} |`;
              });
              if (rows.length > 0) {
                table = `| package | severity | advisory | path |\n| --- | --- | --- | --- |\n${rows.join("\n")}`;
              }
            } catch {}
            if (!table) {
              table = "```\n" + log.trim().slice(-6000) + "\n```";
            }
            const body = `\`scripts/audit-prod-deps.sh\` reported a high or critical advisory in the production dependency tree on ${context.sha.slice(0,7)}.\n\n${table}\n\nFixing advisories is Rob-owned (CLAUDE.md §7). This issue is refreshed by every red scheduled run and gets a comment when the audit is green again; it is never auto-closed.\n${runUrl}`;

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["security", "ops", "high"],
              });
            }
            core.setFailed("Production CVE audit failed; see the tracking issue.");
