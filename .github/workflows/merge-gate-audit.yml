name: Merge Gate Audit

# Server-side branch protection enforces the merge gate (required checks,
# strict, enforce_admins). This workflow is the backstop for the one failure
# GitHub does not announce: protection silently disappearing — the actual
# root cause of incident #479 was a paid-plan lapse that dropped protection
# without any notification, back when this repo was private. The repo is
# public as of 2026-07-25, so that specific cause is gone; the canary stays
# because silent protection loss is invisible whatever causes it. After
# every push to main it
# (1) confirms protection is still present on main and (2) re-verifies that
# the merged PR's head SHA had the full gate green (CI + Product Smoke +
# `Claude verdict`). A violation — or a direct push with no PR at all — files
# a labeled incident issue within a minute and fails loudly on the main
# commit. It cannot prevent a bypass; it makes a silent one impossible.
#
# Canary honesty: the protected=true/false check is fully live under the
# default token. The finer degradation checks (required contexts,
# enforce_admins) need repo Administration read, which GITHUB_TOKEN cannot
# be granted in a workflow — they run best-effort, only when the API
# exposes the data. Making them unconditional requires a scoped machine
# credential (#458, Rob-owned). `workflow_dispatch` runs the canary alone,
# so what this token can actually see is empirically checkable on demand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  issues: write
  pull-requests: read

concurrency:
  group: merge-gate-audit-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify the merged PR's gate was green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          marker="<!-- merge-gate-audit: $SHA -->"

          file_incident() {
            local title="$1" body="$2"
            # One incident per main commit, even across reruns.
            if gh api "repos/$GH_REPO/issues?state=open&labels=ops&per_page=100" \
                --jq '.[].body' | grep -qF "$marker"; then
              echo "Incident already filed for $SHA."
              return 0
            fi
            # Body built via printf: a multiline string literal here would
            # need column-1 lines, which terminate this YAML block scalar.
            gh issue create --title "$title" --label security --label ops \
              --body "$(printf '%s\n\n%s\n%s' "$body" "$marker" \
                '🤖 Filed automatically by the Merge Gate Audit workflow.')"
          }

          # Protection-presence canary: the #479 root cause was a paid-plan
          # lapse silently dropping branch protection. The branch endpoint's
          # `protected` field is readable with this workflow's default token,
          # unlike the admin-only protection endpoint. The contexts check
          # below it is BEST-EFFORT (see header) — it fires only when the
          # token can see protection detail.
          prot=$(gh api "repos/$GH_REPO/branches/main" \
            --jq '{p: .protected, ctx: (.protection.required_status_checks.contexts // [])}' \
            2>/dev/null || echo "")
          if [ -z "$prot" ]; then
            echo "::warning::Could not read branch metadata; skipping protection canary."
          elif [ "$(jq -r .p <<<"$prot")" != "true" ]; then
            file_incident \
              "INCIDENT: branch protection on main is absent" \
              "At push \`$SHA\`, main reports protected=\`$(jq -r .p <<<"$prot")\`. This is the #479 failure class (protection silently dropped, e.g. by a plan lapse). Restore protection before merging anything else — until then every merge is ungated."
            echo "::error::Branch protection on main is absent."
            exit 1
          elif [ "$(jq -r '.ctx | length' <<<"$prot")" -gt 0 ] && \
               ! jq -e '.ctx | index("Claude verdict")' <<<"$prot" >/dev/null; then
            # Contexts are only judged when the token can see them; an empty
            # list is indistinguishable from a permissions-hidden one.
            file_incident \
              "INCIDENT: branch protection on main is degraded" \
              "At push \`$SHA\`, main is protected but its required contexts \`$(jq -c .ctx <<<"$prot")\` no longer include \`Claude verdict\`. The AI review gate is off — restore the required context before merging anything else."
            echo "::error::Branch protection is missing the Claude verdict context."
            exit 1
          fi

          # Dispatch runs exist to probe the canary (and what the token can
          # see) without a push; the merged-PR audit below is push-only.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Canary-only dispatch run. Token visibility: $prot"
            exit 0
          fi

          # Resolve the PR this main commit came from (squash merge commit).
          pr=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha==\"$SHA\")][0].number // empty")

          if [ -z "$pr" ]; then
            file_incident \
              "INCIDENT: direct push to main ($SHA) bypassed the PR gate" \
              "Commit \`$SHA\` was pushed to main by \`$ACTOR\` without an associated merged PR. Direct pushes are break-glass only (see docs/AI_PR_REVIEW_PIPELINE.md); if this was intentional, note why here and close."
            echo "::error::Direct push to main detected ($SHA)."
            exit 1
          fi

          head=$(gh api "repos/$GH_REPO/pulls/$pr" --jq .head.sha)
          echo "Auditing PR #$pr (head $head) merged as $SHA."

          if ! ./scripts/verify-pr-gate.sh "$pr" "$head"; then
            file_incident \
              "INCIDENT: PR #$pr merged with an unverified gate" \
              "PR #$pr was merged as \`$SHA\` but its head SHA \`$head\` did not have the full gate green (CI + Product Smoke + Claude verdict) at audit time. See the failed [audit run](${{ github.server_url }}/$GH_REPO/actions/runs/${{ github.run_id }}) for the exact red/missing checks. This is the #479 incident class — investigate before building on this commit."
            echo "::error::Merge gate audit failed for PR #$pr ($SHA)."
            exit 1
          fi

          echo "Gate verified green for PR #$pr at $head."
