name: Terraform CI

# Static checks for infra/terraform: formatting, validation, lint, a config
# scan, the Conftest rules against their fixtures, and the module tests.
#
# This workflow holds no cloud credentials and never reads state: it requests
# no OIDC token (no `id-token` permission), configures no AWS credentials and
# runs `terraform init -backend=false` only. Planning against an account is a
# separate workflow.
#
# The steps call infra/terraform/check.sh, so a local run and CI are the same
# commands.
#
# Not a required check. The path filter means it does not report at all on a
# pull request that leaves infra/terraform alone, so making it required needs
# a summary job first; that decision is Rob's.
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-ci.yml"

# Least privilege: the job only reads the checked-out source.
permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  terraform-ci:
    name: terraform static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      # Conftest publishes no setup action. Building the pinned version with
      # the runner's Go toolchain verifies it against the Go checksum database.
      - name: Setup Conftest
        run: |
          go install github.com/open-policy-agent/conftest@v0.71.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: terraform fmt
        run: infra/terraform/check.sh fmt

      - name: versions.tf identical in every stack
        run: infra/terraform/check.sh versions

      - name: terraform validate (every stack, no backend)
        run: infra/terraform/check.sh validate

      - name: tflint
        run: infra/terraform/check.sh lint

      - name: terraform test (modules and stacks, mocked provider)
        run: infra/terraform/check.sh test

      - name: conftest (rules against their fixtures)
        run: infra/terraform/check.sh policy

      - name: Config scan (Checkov)
        uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12.3141.0
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          compact: true
          output_format: cli
          download_external_modules: false
          skip_download: true
