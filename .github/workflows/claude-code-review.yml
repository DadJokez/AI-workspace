name: Claude Code Review

# Auto-reviews each pull request once the FULL gate (CI + Product Smoke) is green.
# Codex implements and opens the PR; this hunts for bugs against CLAUDE.md and
# labels `needs-codex` if it wants changes. It comments/labels only — it never
# pushes commits or merges (Rob owns merges). See docs/AI_PR_REVIEW_PIPELINE.md.
#
# Auth: the CLAUDE_CODE_OAUTH_TOKEN secret (Claude GitHub App / `claude
# setup-token`). This is dev tooling for building Comparative — not part of the
# product — so it uses the simple subscription token, not the product's auth.

on:
  workflow_run:
    workflows: ["CI", "Product Smoke"]
    types: [completed]

permissions:
  contents: read
  # The gates-green check reads workflow runs; GitHub began enforcing the
  # documented `actions: read` requirement for that endpoint on 2026-07-19,
  # 403-ing every review run.
  actions: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  # Serialize per commit so the two gate workflows can't double-review.
  group: claude-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run executes trusted default-branch workflow code. Check out
      # the matching helper before resolving or checking out the PR head.
      - name: Checkout review gate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Resolve PR and confirm both gates are green
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Commit containment is ambiguous for stacked PRs. Match the one
          # open PR whose current branch and head are exactly the completed
          # workflow run. The helper returns candidates for a visible failure
          # instead of turning ambiguity into a successful no-op.
          set +e
          resolution=$(gh api --paginate --slurp \
            "repos/$REPO/pulls?state=open&per_page=100" \
            | node .github/scripts/resolve-exact-head-pr.mjs "$SHA" "$HEAD_REF")
          resolution_status=$?
          set -e

          resolution_ok="false"
          if [ "$resolution_status" -eq 0 ]; then
            resolution_ok=$(jq -r '.ok // false' <<<"$resolution")
          fi

          if [ "$resolution_ok" != "true" ]; then
            # Both CI and Product Smoke trigger this workflow. The second run
            # can leave the concurrency queue after the first review already
            # passed and the PR merged. No open PR is then expected; do not
            # overwrite the authenticated success on that merged head.
            if jq -e '.code == "no_open_pull_request"' >/dev/null 2>&1 <<<"$resolution"; then
              echo "No open pull request remains for $HEAD_REF at $SHA — it was likely closed or merged."
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            reason="The pull request lookup failed before producing a diagnostic."
            candidates="none"
            if jq -e 'type == "object"' >/dev/null 2>&1 <<<"$resolution"; then
              reason=$(jq -r '.reason' <<<"$resolution")
              candidates=$(jq -r '
                .candidates
                | if length == 0 then "none"
                  else map("#\(.number) (\(.headRefName) @ \(.headSha[0:7]))") | join(", ")
                  end
              ' <<<"$resolution")
            fi

            {
              echo "### Claude review gate could not resolve the pull request"
              echo
              echo "- Workflow head: \`$HEAD_REF\` at \`$SHA\`"
              echo "- Reason: $reason"
              echo "- Candidate pull requests: $candidates"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error title=Claude review gate resolution failed::See the step summary for the exact head and candidate pull requests."
            existing_completed=$(gh api "repos/$REPO/commits/$SHA/status" \
              --jq '[.statuses[] | select(.context=="Claude review completed")][0].state // ""')
            existing_verdict=$(gh api "repos/$REPO/commits/$SHA/status" \
              --jq '[.statuses[] | select(.context=="Claude verdict")][0].state // ""')
            if [ "$existing_completed" = "success" ] && [ "$existing_verdict" = "success" ]; then
              echo "Preserving the existing authenticated Claude success for $SHA."
            else
              gh api -X POST "repos/$REPO/statuses/$SHA" \
                -f state="failure" \
                -f context="Claude verdict" \
                -f description="Review gate could not resolve the exact PR head" \
                -f target_url="$TARGET_URL" >/dev/null
            fi
            exit 1
          fi
          pr=$(jq -r '.pr' <<<"$resolution")

          # Require BOTH gate workflows to have a successful run at this SHA.
          # The later-completing gate triggers this and sees both green.
          for wf in "CI" "Product Smoke"; do
            ok=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.name==\"$wf\" and .conclusion==\"success\")] | length")
            if [ "${ok:-0}" = "0" ]; then
              echo "Gate '$wf' is not green yet for $SHA — waiting."
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done

          # Dedup: skip the expensive review if this SHA already carries the
          # completed-review commit status, but still publish the verdict below
          # so a stale failure from PR-open does not keep branch protection
          # blocked. The status channel requires statuses:write, which the
          # on-demand @claude workflow deliberately lacks (#459) — a PR comment
          # can no longer green the gate.
          completed=$(gh api "repos/$REPO/commits/$SHA/status" \
            --jq '.statuses[] | select(.context=="Claude review completed") | .state')
          if [ "$completed" = "success" ]; then
            echo "Already reviewed $SHA — skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "already_reviewed=true" >> "$GITHUB_OUTPUT"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "already_reviewed=false" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Claude review
        id: claude_review
        if: steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --model claude-opus-4-8
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh api:*),Bash(gh label:*)"
          prompt: |
            You are the automated reviewer for pull request #${{ steps.gate.outputs.pr }}
            in ${{ github.repository }}. The full gate (lint, typecheck, unit tests,
            build, and the Playwright browser smoke) is already green.

            Review the PR's diff against the rubric in CLAUDE.md at the repo root.
            Hunt for real bugs, regressions, security issues (data scoping, secrets,
            prompt injection), missing tests, and rubric violations. Read the diff
            with `gh pr diff ${{ steps.gate.outputs.pr }}` and enough surrounding
            code to judge it. Be specific and adversarial; cite file:line; prefer a
            few high-signal findings over many nits, and lead with the blocker.

            Post the review with:
              gh pr review ${{ steps.gate.outputs.pr }} --comment --body "<your review>"
            (use --comment only; never --approve or --request-changes). If you want
            changes, also run:
              gh pr edit ${{ steps.gate.outputs.pr }} --add-label needs-codex
            and say clearly what Codex should fix on the same branch. If it's clean,
            say so and remove a stale needs-codex label if present with:
              gh pr edit ${{ steps.gate.outputs.pr }} --remove-label needs-codex
            Do NOT push commits and do NOT merge — Rob owns merges.

      - name: Record Claude review completion
        if: steps.gate.outputs.go == 'true' && steps.claude_review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The authenticated review-happened fact (#459). A commit status, not
          # a comment: posting one requires statuses:write, so neither a PR
          # commenter nor the @claude workflow's token can forge it.
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="success" \
            -f context="Claude review completed" \
            -f description="Automated review completed for this commit" \
            -f target_url="$TARGET_URL" >/dev/null

      - name: Publish Claude verdict
        if: >-
          ${{
            always() &&
            (steps.gate.outputs.go == 'true' || steps.gate.outputs.already_reviewed == 'true')
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CLAUDE_OUTCOME: ${{ steps.claude_review.outcome }}
          REVIEW_RAN: ${{ steps.gate.outputs.go }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          state="success"
          description="Claude review passed for this commit"

          completed=$(gh api "repos/$REPO/commits/$SHA/status" \
            --jq '.statuses[] | select(.context=="Claude review completed") | .state')

          if [ "$REVIEW_RAN" = "true" ] && [ "$CLAUDE_OUTCOME" != "success" ]; then
            state="failure"
            description="Claude review failed to complete"
          elif gh api "repos/$REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name' \
              | grep -qx "needs-codex"; then
            state="failure"
            description="Claude requested changes; needs-codex is present"
          elif [ "$completed" != "success" ]; then
            state="failure"
            description="Claude review has not passed for this commit"
          fi

          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context="Claude verdict" \
            -f description="$description" \
            -f target_url="$TARGET_URL" >/dev/null

          echo "Claude verdict: $state - $description"
