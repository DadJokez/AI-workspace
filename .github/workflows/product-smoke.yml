name: Product Smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production-like URL to smoke test"
        required: false
        default: ""
        # Falls back to the SMOKE_BASE_URL repo variable when left blank.

concurrency:
  group: product-smoke-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The full smoke suite runs 73 tests per Playwright project with a single
  # worker; running the two projects as parallel matrix legs roughly halves
  # the wall clock. Branch protection does NOT point at these legs — it points
  # at the `local browser smoke` summary job below, which fans in the results.
  browser-smoke-shard:
    name: browser smoke (${{ matrix.project }})
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @ai-workspace/web exec node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Caching the browser binaries removes the Chromium CDN download from
      # the critical path — historically a flake source of its own.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-

      - name: Install Chromium
        run: pnpm --filter @ai-workspace/web exec playwright install --with-deps chromium

      - name: Run browser smoke
        run: pnpm --filter @ai-workspace/web exec playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  # Branch protection requires a check literally named `local browser smoke`.
  # This job preserves that name over the sharded matrix. It must run on
  # shard failure (not be skipped) and exit non-zero: a skipped required
  # check would satisfy branch protection, silently failing the gate open.
  browser-smoke:
    name: local browser smoke
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    needs: browser-smoke-shard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.browser-smoke-shard.result }}" != "success" ]; then
            echo "browser smoke shards did not all pass: ${{ needs.browser-smoke-shard.result }}"
            exit 1
          fi
          echo "all browser smoke shards passed"

  authenticated-browser-smoke:
    name: authenticated browser smoke
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: aihub_dev
          POSTGRES_DB: aihub_auth_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub_auth_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aihub:aihub_dev@127.0.0.1:5432/aihub_auth_smoke
      NEXTAUTH_SECRET: playwright-local-secret-with-enough-length
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @ai-workspace/web exec node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-

      - name: Install Chromium
        run: pnpm --filter @ai-workspace/web exec playwright install --with-deps chromium

      - name: Run authenticated browser smoke
        run: pnpm smoke:browser:auth

      - name: Upload authenticated Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  production-smoke:
    name: production public smoke
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Run production smoke
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.base_url || vars.SMOKE_BASE_URL }}
        run: node scripts/production-smoke.mjs
