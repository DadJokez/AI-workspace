name: Product Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production-like URL to smoke test"
        required: false
        default: "https://comparative.builtwithrobot.link"
      run_evals:
        description: "Also run the real-model behavioral eval pack (costs Bedrock quota)"
        type: boolean
        required: false
        default: false

# Least privilege baseline; `foundational_evals` re-declares its own block to
# add the `id-token: write` its OIDC role assumption needs. Without this the
# workflow inherits the repository default, which can be read/write.
permissions:
  contents: read

concurrency:
  group: product-smoke-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "351478076796"
  PR_EVAL_MAX_COST_USD: "1.50"

jobs:
  # #812: the docs-only fast lane's decision, computed from git alone in the
  # reusable workflow. Every PR-lane job below needs it and runs unless it
  # reports docs_only == 'true'. `!cancelled()` keeps them running when the
  # classifier job itself errors: a classifier failure is the full lane,
  # never a skip. The required-check names live on the summary jobs at the
  # bottom of this file; the heavy jobs carry a "[full lane]" suffix.
  classify:
    uses: ./.github/workflows/classify-changed-paths.yml

  # The full smoke suite runs 73 tests per Playwright project with a single
  # worker; running the two projects as parallel matrix legs roughly halves
  # the wall clock. Branch protection requires both leg names AND the `local
  # browser smoke` fan-in; all three are reported by the summary jobs below.
  browser-smoke-shard:
    name: browser smoke (${{ matrix.project }}) [full lane]
    needs: [classify]
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'pull_request' || github.event_name == 'push') &&
          needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @ai-workspace/web exec node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Caching the browser binaries removes the Chromium CDN download from
      # the critical path — historically a flake source of its own.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-

      - name: Install Chromium
        run: pnpm --filter @ai-workspace/web exec playwright install --with-deps chromium

      - name: Run browser smoke
        run: pnpm --filter @ai-workspace/web exec playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  # The mocked feature suite proves UI behavior, but this canary deliberately
  # does not intercept /api/chat. It drives a CSV through the real browser,
  # route, Postgres persistence, deterministic agent/resource-tool loop, SSE
  # rendering, reload, and later-turn retrieval. It runs on every code change
  # plus the six-hour scheduled/manual production-smoke cadence.
  core-pipeline-smoke:
    name: core chat + CSV pipeline
    needs: [classify]
    if: ${{ !cancelled() && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # ECR Public mirror: no auth needed and not subject to Docker Hub anonymous pull rate limits (#708)
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: aihub_dev
          POSTGRES_DB: aihub_core_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub_core_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aihub:aihub_dev@127.0.0.1:5432/aihub_core_smoke
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # This lane's Playwright webServer runs `next build` before `next start`
      # (prod-server smoke). Same cache key as ci.yml so a warm compiler cache
      # bounds the added build time.
      - name: Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'packages/**/*.ts', '!**/node_modules/**', '!apps/web/.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @ai-workspace/web exec node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-

      - name: Install Chromium
        run: pnpm --filter @ai-workspace/web exec playwright install --with-deps chromium

      - name: Run real core pipeline canary
        run: pnpm smoke:browser:core

      - name: Upload core pipeline report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-core-pipeline-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  # Real-model behavioral evals are NOT a per-PR gate. They cost ~148k Bedrock
  # tokens per run against a non-adjustable 10.8M/day account ceiling, and
  # `strict: true` re-gates every open PR after each merge — so a normal day's
  # merges exhausted the quota and blocked all merges on an infra limit rather
  # than on code (#706). This matches the layering in
  # docs/CORE_RELIABILITY_REPLUMBING_SPEC.md, which places behavioral model
  # evals at "nightly and release candidate", not every PR.
  #
  # Coverage is NOT reduced: nightly-evals.yml runs the FULL pack (every
  # injection suite included) against the production-default model and files
  # an eval-regression issue on failure. Run on demand here with
  # `gh workflow run product-smoke.yml -f run_evals=true`.
  foundational_evals:
    name: foundational real-model evals
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_evals }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate AWS eval configuration
        env:
          AWS_EVAL_ROLE_ARN: ${{ vars.AWS_EVAL_ROLE_ARN }}
        run: |
          if [ -z "$AWS_EVAL_ROLE_ARN" ]; then
            echo "::error title=PR evals are disabled::AWS_EVAL_ROLE_ARN is not configured. Deploy AiWorkspaceEvalCiStack and set the repository Actions variable."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 1800
          role-session-name: ondemand-evals-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Run foundational real-model evals
        id: evals
        env:
          BEDROCK_CLIENT: real
        # --gate: the merge-gate pack — repeat-sampled injection/security
        # cases only. The broad single-sample behavioral pack runs nightly;
        # on a required PR check it made every gate a per-sample lottery
        # (~70 cases at ~99% each ≈ 60% lane pass rate, observed 2026-07-25).
        run: pnpm eval --gate

      # Post-run spend-regression tripwire. Superseded runs are actively
      # canceled by workflow concurrency; this check forces review if the
      # stable gate pack grows beyond its calibrated envelope.
      - name: Enforce eval cost tripwire
        if: ${{ always() && steps.evals.outcome != 'skipped' }}
        env:
          MAX_COST_USD: ${{ env.PR_EVAL_MAX_COST_USD }}
        run: |
          report_path="$(find packages/evals/eval-reports -type f -name '*.json' -print 2>/dev/null | sort | tail -n 1)"
          if [ -z "$report_path" ]; then
            echo "::error title=Eval report missing::The foundational real-model eval command did not produce a JSON report."
            exit 1
          fi
          REPORT_PATH="$report_path" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          const actual = report?.meta?.approxCostUsd;
          const maximumRaw = process.env.MAX_COST_USD;
          const maximum = Number(maximumRaw);
          if (
            typeof actual !== "number" ||
            !Number.isFinite(actual) ||
            actual < 0 ||
            !maximumRaw?.trim() ||
            !Number.isFinite(maximum) ||
            maximum < 0
          ) {
            console.error("::error title=Invalid eval cost::The report or configured tripwire does not contain a finite non-negative cost.");
            process.exit(1);
          }
          console.log(`Estimated eval cost: $${actual.toFixed(4)} (tripwire $${maximum.toFixed(2)})`);
          if (actual > maximum) {
            console.error(`::error title=PR eval cost regression::Estimated cost $${actual.toFixed(4)} exceeds the $${maximum.toFixed(2)} tripwire.`);
            process.exit(1);
          }
          NODE

      - name: Upload eval report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ondemand-eval-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/evals/eval-reports/
          if-no-files-found: warn

  authenticated-browser-smoke:
    name: authenticated browser smoke [full lane]
    needs: [classify]
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'pull_request' || github.event_name == 'push') &&
          needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # ECR Public mirror: no auth needed and not subject to Docker Hub anonymous pull rate limits (#708)
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: aihub
          POSTGRES_PASSWORD: aihub_dev
          POSTGRES_DB: aihub_auth_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aihub -d aihub_auth_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aihub:aihub_dev@127.0.0.1:5432/aihub_auth_smoke
      NEXTAUTH_SECRET: playwright-local-secret-with-enough-length
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # This lane's Playwright webServer runs `next build` before `next start`
      # (prod-server smoke). Same cache key as ci.yml so a warm compiler cache
      # bounds the added build time.
      - name: Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'packages/**/*.ts', '!**/node_modules/**', '!apps/web/.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @ai-workspace/web exec node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-

      - name: Install Chromium
        run: pnpm --filter @ai-workspace/web exec playwright install --with-deps chromium

      - name: Run authenticated browser smoke
        run: pnpm smoke:browser:auth

      - name: Upload authenticated Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-auth-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  production-smoke:
    name: production public smoke
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Run production smoke
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.base_url || 'https://comparative.builtwithrobot.link' }}
        run: node scripts/production-smoke.mjs

  # ---------------------------------------------------------------------------
  # Required-check summaries (#812). Branch protection requires the contexts
  # named below, unchanged. Each name now belongs to exactly ONE job — its
  # summary — so no second check run with a required name can ever exist to
  # collide with it; the heavy jobs above carry a "[full lane]" suffix. A
  # summary passes on a real success of its heavy job, or on a skip the
  # classifier explicitly asked for. A skip without that verdict, a failure,
  # or a cancellation is red: the summaries run on failure (never skip) and
  # exit non-zero, because a skipped required check satisfies branch
  # protection and would fail the gate open.
  # ---------------------------------------------------------------------------
  browser-smoke-shard-summary:
    name: browser smoke (${{ matrix.project }})
    needs: [classify, browser-smoke-shard]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      # `needs.<matrix job>.result` is the aggregate over both legs, so a red
      # leg turns both summaries red. Both are required, so the merge decision
      # is unchanged; the leg's own "[full lane]" check and its Playwright
      # report artifact name the failing project.
      - name: Report browser smoke (${{ matrix.project }})
        env:
          LABEL: browser smoke (${{ matrix.project }})
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          RESULT: ${{ needs.browser-smoke-shard.result }}
        run: |
          if [ "$RESULT" = "success" ]; then echo "$LABEL passed"; exit 0; fi
          if [ "$RESULT" = "skipped" ] && [ "$DOCS_ONLY" = "true" ]; then echo "docs-only: skipped"; exit 0; fi
          echo "$LABEL did not pass (result=$RESULT, docs_only=$DOCS_ONLY)"; exit 1

  # Fans the sharded matrix and the real pipeline canary into the one check
  # branch protection has always required under this name.
  browser-smoke:
    name: local browser smoke
    needs: [classify, browser-smoke-shard, core-pipeline-smoke]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check browser and pipeline results
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          SHARDS: ${{ needs.browser-smoke-shard.result }}
          CORE: ${{ needs.core-pipeline-smoke.result }}
        run: |
          if [ "$SHARDS" = "success" ] && [ "$CORE" = "success" ]; then
            echo "all browser smoke shards and the core chat + CSV pipeline passed"; exit 0
          fi
          if [ "$SHARDS" = "skipped" ] && [ "$CORE" = "skipped" ] && [ "$DOCS_ONLY" = "true" ]; then
            echo "docs-only: skipped"; exit 0
          fi
          echo "local browser smoke did not pass (shards=$SHARDS, core pipeline=$CORE, docs_only=$DOCS_ONLY)"; exit 1

  authenticated-browser-smoke-summary:
    name: authenticated browser smoke
    needs: [classify, authenticated-browser-smoke]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report authenticated browser smoke
        env:
          LABEL: authenticated browser smoke
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          RESULT: ${{ needs.authenticated-browser-smoke.result }}
        run: |
          if [ "$RESULT" = "success" ]; then echo "$LABEL passed"; exit 0; fi
          if [ "$RESULT" = "skipped" ] && [ "$DOCS_ONLY" = "true" ]; then echo "docs-only: skipped"; exit 0; fi
          echo "$LABEL did not pass (result=$RESULT, docs_only=$DOCS_ONLY)"; exit 1
