<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 28px; background: var(--bg); }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const { Callout, Tooltip, Dialog, Button, IconButton, Spinner } = window.UmberDesignSystem_5c2597;
  const Ico = ({ d }) => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>);
  const Info = <Ico d={<><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></>} />;
  const Copy = <Ico d={<><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></>} />;

  function Demo() {
    const [open, setOpen] = React.useState(false);
    return (
      <div className="stack">
        <Callout tone="accent" title="Committed-use pricing" icon={Info}>
          Discounts apply automatically above 100k DBU / month across all warehouses.
        </Callout>
        <Callout tone="danger">Your access token expired — re-authenticate to keep querying.</Callout>
        <div className="row">
          <Tooltip content="Copy endpoint URL"><IconButton aria-label="Copy">{Copy}</IconButton></Tooltip>
          <Tooltip content="Opens in a new tab" side="right"><Button variant="outline" size="sm">Docs</Button></Tooltip>
          <Button variant="pop" onClick={() => setOpen(true)}>Delete warehouse…</Button>
          <span style={{ display: "inline-flex", alignItems: "center", gap: 8, color: "var(--text-muted)", fontSize: 13 }}><Spinner size={16} style={{ color: "var(--pop)" }} /> Agent working…</span>
        </div>
        <Dialog open={open} onClose={() => setOpen(false)} title="Delete warehouse?"
          description="This action cannot be undone."
          footer={<>
            <Button variant="ghost" onClick={() => setOpen(false)}>Cancel</Button>
            <Button variant="pop" onClick={() => setOpen(false)}>Delete</Button>
          </>}>
          Queries currently in flight will be cancelled and any cached results dropped.
        </Dialog>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
