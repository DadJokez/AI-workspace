<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 26px; background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 4px; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); background: var(--surface); }
  .cell span { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-subtle); }
  .avatars { display: flex; align-items: center; gap: 14px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const { Icon, Avatar } = window.UmberDesignSystem_5c2597;
  const names = ["search","plus","x","check","check-circle","chevron-down","chevron-right","arrow-right","message-square","bot","cpu","box","calendar","share","rocket","code","globe","workflow","command","book-open","history","users","wrench","paperclip","arrow-up","refresh","table","lock","database","activity","settings","bar-chart","clock","play","folder","file-text","sparkles","zap","link","eye","trending-up","git-commit","stop-circle","star"];
  function Demo() {
    return (
      <div>
        <div className="grid">
          {names.map(n => <div className="cell" key={n}><Icon name={n} size={20} /><span>{n}</span></div>)}
        </div>
        <div className="avatars">
          <Avatar name="Ada Lindmark" />
          <Avatar name="Marcus Reyes" tone="tan" />
          <Avatar icon="bot" shape="square" tone="pop" />
          <Avatar icon="box" shape="square" tone="accent" />
          <Avatar name="QA" size={40} shape="square" tone="neutral" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
